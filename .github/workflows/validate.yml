name: Validate knowledge base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate relative links
        run: python scripts/validate_links.py

      - name: Validate sources and freshness
        run: python scripts/validate_sources.py

      - name: Validate knowledge graph
        run: python scripts/build_graph.py

      - name: Build MkDocs in strict mode
        run: mkdocs build --strict

      - name: Exercise content generators
        run: |
          python scripts/generate_glossary.py
          python scripts/generate_indexes.py
